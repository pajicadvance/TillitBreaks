plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = project.mod_version + "+" + stonecutter.current.version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.fzzyhmstrs.me/"}
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.wispforest.io/releases/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.project}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${property("parchment_version")}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property("fabric_version")}"
    modImplementation "com.terraformersmc:modmenu:${property("modmenu_version")}"
    modImplementation "dev.isxander:yet-another-config-lib:${property("yacl_version")}"
    modCompileOnly "maven.modrinth:nyfs-quivers:${property("nyfsquiver_version")}"
    if (stonecutter.eval(stonecutter.current.version, "<=1.21.4")) {
        modImplementation "maven.modrinth:accessorify:${property("accessorify_version")}"
        modImplementation "me.fzzyhmstrs:fzzy_config:${property("fzzy_version")}"
        modImplementation "io.wispforest:accessories-fabric:${property("accessories_version")}"
        modImplementation "io.wispforest:owo-lib:${property("owo_version")}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", stonecutter.current.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": stonecutter.current.version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = file(getRootDir().path + "/CHANGELOG.md").text
    type = STABLE
    modLoaders.add("fabric")
    displayName = project.mod_version + " for Fabric " + stonecutter.current.version

    modrinth {
        accessToken = providers.environmentVariable("MR_KEY")
        projectId = "GG12dlQh"
        minecraftVersions.add(stonecutter.current.version)
        if (stonecutter.eval(stonecutter.current.version, "1.21.1")) {
            minecraftVersions.add("1.21")
            minecraftVersions.add("1.21.2")
            minecraftVersions.add("1.21.3")
            minecraftVersions.add("1.21.4")
            minecraftVersions.add("1.21.5")
        }
        if (stonecutter.eval(stonecutter.current.version, "1.21.8")) {
            minecraftVersions.add("1.21.6")
            minecraftVersions.add("1.21.7")
        }
        requires("fabric-api", "yacl")
        optional("modmenu")
    }

    curseforge {
        accessToken = providers.environmentVariable("CF_KEY")
        projectId = "1099394"
        minecraftVersions.add(stonecutter.current.version)
        if (stonecutter.eval(stonecutter.current.version, "1.21.1")) {
            minecraftVersions.add("1.21")
            minecraftVersions.add("1.21.2")
            minecraftVersions.add("1.21.3")
            minecraftVersions.add("1.21.4")
            minecraftVersions.add("1.21.5")
        }
        if (stonecutter.eval(stonecutter.current.version, "1.21.8")) {
            minecraftVersions.add("1.21.6")
            minecraftVersions.add("1.21.7")
        }
        javaVersions.add(stonecutter.eval(stonecutter.current.version, ">=1.20.5")
                ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = false
        requires("fabric-api", "yacl")
        optional("modmenu")
    }
}